# Installed by the agentic-sdlc install skill. Keeps approved:specs and approved:design in step with gate PR reviews.
# Runs the default branch's .github/sdlc/automation.py, never code from a pull request.
name: sdlc-review-mirror
on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types: [synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: write
# Each run recomputes from the PR's current state, so a superseded pending run may be dropped.
concurrency:
  group: sdlc-review-mirror-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/sdlc/automation.py review-mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
